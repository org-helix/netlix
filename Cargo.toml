[package]
name = "netlix"
version = "0.3.0"
edition = "2024"
description = "Minimal network simulator: draw a topology, configure IPs, ping. A Helix project."
license = "GPL-3.0-only"
authors = ["Helix contributors"]
homepage = "https://org-helix.github.io/helix-website/"
repository = "https://github.com/org-helix/netlix"

[dependencies]
eframe = { version = "0.37", features = ["persistence"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.18"
sys-locale = "0.3"

# Icon and version information in netlix.exe.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true
