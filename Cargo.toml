[package]
name = "netlix"
version = "0.1.0"
edition = "2024"
description = "Minimal network simulator: draw a topology, configure IPs, ping."
repository = "https://github.com/org-helix/netlix"

[dependencies]
eframe = { version = "0.37", features = ["persistence"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.18"

[profile.release]
lto = "thin"
strip = true
